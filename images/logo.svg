<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 猫咪头部 -->
    <circle cx="60" cy="60" r="50" fill="#FFB6C1"/>
    
    <!-- 耳朵 -->
    <path d="M30 40 L40 25 L50 40 Z" fill="#FF69B4"/>
    <path d="M90 40 L80 25 L70 40 Z" fill="#FF69B4"/>
    
    <!-- 眼睛 -->
    <circle cx="45" cy="55" r="8" fill="white"/>
    <circle cx="75" cy="55" r="8" fill="white"/>
    <circle cx="45" cy="55" r="4" fill="black"/>
    <circle cx="75" cy="55" r="4" fill="black"/>
    
    <!-- 腮红 -->
    <circle cx="35" cy="65" r="6" fill="#FFB6C1" opacity="0.6"/>
    <circle cx="85" cy="65" r="6" fill="#FFB6C1" opacity="0.6"/>
    
    <!-- 嘴巴 -->
    <path d="M55 70 Q60 75 65 70" stroke="black" stroke-width="2" fill="none"/>
    
    <!-- 胡须 -->
    <line x1="30" y1="65" x2="45" y2="68" stroke="black" stroke-width="1"/>
    <line x1="30" y1="70" x2="45" y2="70" stroke="black" stroke-width="1"/>
    <line x1="30" y1="75" x2="45" y2="72" stroke="black" stroke-width="1"/>
    
    <line x1="90" y1="65" x2="75" y2="68" stroke="black" stroke-width="1"/>
    <line x1="90" y1="70" x2="75" y2="70" stroke="black" stroke-width="1"/>
    <line x1="90" y1="75" x2="75" y2="72" stroke="black" stroke-width="1"/>
</svg>
