<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥猫表情包生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -.022em;
            background-color: #ffffff;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 980px;
            width: 100%;
            padding: 40px 20px;
            margin: 0 auto;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .title {
            text-align: center;
            font-size: 56px;
            line-height: 1.07143;
            font-weight: 600;
            letter-spacing: -.005em;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            font-size: 28px;
            line-height: 1.10722;
            font-weight: 400;
            letter-spacing: .004em;
            color: #86868b;
            margin-bottom: 50px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            font-size: 17px;
            line-height: 1.23536;
            font-weight: 400;
            letter-spacing: -.022em;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            background-color: rgba(0, 0, 0, 0.02);
        }

        input[type="text"]:focus {
            border-color: #0066cc;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        button {
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 17px;
            line-height: 1.23536;
            font-weight: 400;
            letter-spacing: -.022em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0077ED;
        }

        button:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #response {
            text-align: center;
            color: #86868b;
            font-size: 17px;
            line-height: 1.23536;
            margin: 20px 0;
            display: none;
        }

        .image-container {
            margin: 30px auto;
            text-align: center;
            max-width: 680px;
        }

        #imagePreview {
            max-width: 100%;
            border-radius: 18px;
            display: none;
            margin-bottom: 20px;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }

        #imagePreview:hover {
            transform: scale(1.02);
        }

        .download-btn {
            display: none;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-size: 17px;
            line-height: 1.23536;
            font-weight: 400;
            letter-spacing: -.022em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: #1d1d1f;
            transform: translateY(-1px);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 30px auto;
            justify-content: center;
            max-width: 680px;
        }

        .suggestion-tag {
            padding: 8px 16px;
            background-color: rgba(0, 0, 0, 0.02);
            border: 1px solid #d2d2d7;
            border-radius: 18px;
            color: #1d1d1f;
            font-size: 14px;
            line-height: 1.33337;
            font-weight: 400;
            letter-spacing: -.01em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .suggestion-tag:hover {
            background-color: rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: #86868b;
            font-size: 12px;
            line-height: 1.33337;
            font-weight: 400;
            letter-spacing: -.01em;
        }

        @media (max-width: 734px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 40px;
            }

            .subtitle {
                font-size: 21px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <img src="images/logo.svg" alt="肥猫logo" class="logo">
            <h1 class="title">肥猫表情包</h1>
        </div>
        <p class="subtitle">让每一个表情都充满灵动</p>
        
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="描述你想要的表情..." />
            <button onclick="sendMessage()" id="generateBtn">生成表情</button>
        </div>

        <div class="suggestions">
            <div class="suggestion-tag" onclick="useTemplate('开心')">开心</div>
            <div class="suggestion-tag" onclick="useTemplate('生气')">生气</div>
            <div class="suggestion-tag" onclick="useTemplate('可爱')">可爱</div>
            <div class="suggestion-tag" onclick="useTemplate('震惊')">震惊</div>
            <div class="suggestion-tag" onclick="useTemplate('疑惑')">疑惑</div>
            <div class="suggestion-tag" onclick="useTemplate('暴躁')">暴躁</div>
            <div class="suggestion-tag" onclick="useTemplate('酸了')">酸了</div>
            <div class="suggestion-tag" onclick="useTemplate('害怕')">害怕</div>
            <div class="suggestion-tag" onclick="useTemplate('期待')">期待</div>
            <div class="suggestion-tag" onclick="useTemplate('无语')">无语</div>
            <div class="suggestion-tag" onclick="useTemplate('委屈')">委屈</div>
            <div class="suggestion-tag" onclick="useTemplate('得意')">得意</div>
            <div class="suggestion-tag" onclick="useTemplate('困')">困</div>
            <div class="suggestion-tag" onclick="useTemplate('饿了')">饿了</div>
            <div class="suggestion-tag" onclick="useTemplate('害羞')">害羞</div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div>正在生成你的专属表情...</div>
        </div>

        <div id="response"></div>

        <div class="image-container">
            <img id="imagePreview" alt="生成的表情包" onclick="previewImage(this.src)" />
            <button id="downloadBtn" class="download-btn" onclick="downloadImage()">
                下载表情包
            </button>
        </div>

        <div class="footer">
            轻触标签，快速生成对应心情的表情包
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function useTemplate(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        const originalSendMessage = sendMessage;
        sendMessage = async function() {
            const button = document.getElementById('generateBtn');
            const input = document.getElementById('messageInput');
            const downloadBtn = document.getElementById('downloadBtn');
            
            button.disabled = true;
            input.disabled = true;
            downloadBtn.style.display = 'none';
            
            await originalSendMessage();
            
            button.disabled = false;
            input.disabled = false;
            if (document.getElementById('imagePreview').style.display === 'block') {
                downloadBtn.style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
